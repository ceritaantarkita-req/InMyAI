[package]
name = "inmyai-desktop"
version = "0.1.0"
description = "InMyAI desktop shell - a native window around the existing local Next.js + FastAPI app, plus a real OS folder picker."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[[bin]]
name = "inmyai-desktop"
path = "src/main.rs"
